services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whoami}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whoami}
      POSTGRES_DB: ${POSTGRES_DB:-whoami}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_PORT: ${APP_PORT:-3000}
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-whoami}:${POSTGRES_PASSWORD:-whoami}@postgres:5432/${POSTGRES_DB:-whoami}?schema=public
    ports:
      - '${APP_PORT:-3000}:${APP_PORT:-3000}'
    init: true
    restart: on-failure:3

volumes:
  pgdata:

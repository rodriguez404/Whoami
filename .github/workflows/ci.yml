name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Новый пуш в ту же ветку отменяет предыдущий прогон: незачем занимать раннеры
# проверкой кода, который уже устарел.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: whoami
          POSTGRES_PASSWORD: whoami
          POSTGRES_DB: whoami
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whoami -d whoami"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DSN: postgresql://whoami:whoami@localhost:5432/whoami?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Deps installation
        run: npm ci

      - name: Prisma client
        run: npm run generate

      - name: Linter
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Migrations
        run: npx prisma migrate deploy

      # Дважды подряд: повторный запуск обязан пройти без нарушения уникальности.
      - name: Seed twice
        run: npx prisma db seed && npx prisma db seed

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

      # schema.gql пишется только при запуске в разработке. Если его забыли
      # перегенерировать, в репозитории лежит устаревший контракт API.
      - name: Schema is up to date
        run: |
          NODE_ENV=development APP_PORT=3999 node dist/main.js &
          until curl -sf http://localhost:3999/health > /dev/null; do sleep 1; done
          kill %1
          git diff --exit-code schema.gql

  compose:
    name: compose up from scratch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Start stack
        run: docker compose up --build -d --wait

      - name: Task query from the assignment
        run: |
          curl -sf -X POST http://localhost:3000/graphql \
            -H "Content-Type: application/json" \
            -d '{"query":"{ profile { name description skills { name } experience { company position } projects { name } } }"}' \
            -o response.json
          cat response.json
          if grep -q '"errors"' response.json; then exit 1; fi
          grep -q '"profile"' response.json

      # Сид выполняется при каждом старте контейнера, поэтому обязан пережить рестарт.
      - name: Restart does not duplicate data
        run: |
          before=$(docker compose exec -T postgres psql -U whoami -d whoami -tAc "select count(*) from skill")
          docker compose restart app
          docker compose up -d --wait
          after=$(docker compose exec -T postgres psql -U whoami -d whoami -tAc "select count(*) from skill")
          echo "навыков до: $before, после: $after"
          test "$before" = "$after"

      # Отдельно от логов приложения: причина «unhealthy» лежит в выводе пробы,
      # а его docker compose logs не показывает.
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          echo "--- health ---"
          for c in $(docker compose ps -aq); do
            docker inspect "$c" --format '{{.Name}} => {{.State.Status}} (exit {{.State.ExitCode}}){{if .State.Health}} health={{.State.Health.Status}}{{range .State.Health.Log}} [exit {{.ExitCode}}] {{.Output}}{{end}}{{end}}'
          done
          echo "--- logs ---"
          docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

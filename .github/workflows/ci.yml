name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Новый пуш в ту же ветку отменяет предыдущий прогон: незачем занимать раннеры
# проверкой кода, который уже устарел.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Deps installation
        run: npm ci

      - name: Linter
        run: npm run lint

      - name: Build
        run: npm run build
